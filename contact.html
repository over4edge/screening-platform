<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>联系我们 — SoundScreen</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%239a9a9a'%3E%3Cpath d='M3 9v6h4l5 4V5L7 9H3z'/%3E%3Cpath d='M16 8.5a5 5 0 0 1 0 7' fill='none' stroke='%239a9a9a' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M19 5.5a9 9 0 0 1 0 13' fill='none' stroke='%239a9a9a' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900&family=Instrument+Serif:ital@1&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900&family=Instrument+Serif:ital@1&display=swap"></noscript>
<script src="js/theme.js"></script>
<style>
/* ---- 双主题：与任务大厅一致 ---- */
html, body { background: var(--bg) !important; color: var(--text); }
:root {
  --bg: #f6f5f1; --text: #111111; --muted: #6e6e6e;
  --border: rgba(0,0,0,0.16); --card-bg: rgba(255,255,255,0.72);
  --card-line: rgba(0,0,0,0.12); --card-shadow: 0 10px 30px rgba(30,35,60,0.08);
  --burger-bg: rgba(0,0,0,0.05); --nav-border-h: rgba(0,0,0,0.32);
  --solid-bg: linear-gradient(180deg, #222222 0%, #3d3d3d 48%, #585858 100%);
  --solid-c: #ffffff; --solid-border: #1c1c1c;
  --solid-bg-h: linear-gradient(180deg, #111111 0%, #2c2c2c 42%, #4a4a4a 100%);
  --solid-border-h: #000000;
  --solid-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 0 22px rgba(110,130,190,0.30), 0 8px 18px rgba(0,0,0,0.16);
  --ghost-bg: linear-gradient(135deg, rgba(255,255,255,0.65), rgba(255,255,255,0.25) 50%, rgba(180,190,220,0.28));
  --ghost-c: #1a1a1a; --ghost-border: rgba(0,0,0,0.20);
  --ghost-bg-h: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,255,255,0.4) 48%, rgba(190,205,240,0.5));
  --ghost-border-h: rgba(0,0,0,0.4);
  --hero-bg:
    radial-gradient(120% 60% at 50% 8%, rgba(120,140,190,0.10) 0%, rgba(120,140,190,0) 55%),
    radial-gradient(90% 55% at 50% 108%, rgba(110,140,210,0.10) 0%, rgba(0,0,0,0) 60%),
    #f6f5f1;
}
:root[data-theme="dark"]{
  --bg: #000000; --text: #ffffff; --muted: #9a9a9a;
  --border: rgba(255,255,255,0.16); --card-bg: rgba(20,20,20,0.72);
  --card-line: rgba(255,255,255,0.14); --card-shadow: 0 10px 30px rgba(0,0,0,0.5);
  --burger-bg: rgba(8,8,8,0.55); --nav-border-h: rgba(235,235,235,0.9);
  --solid-bg: linear-gradient(180deg, #ffffff 0%, #e7e7e7 48%, #cfcfcf 100%);
  --solid-c: #111111; --solid-border: #ffffff;
  --solid-bg-h: linear-gradient(180deg, #ffffff 0%, #f3f6ff 42%, #d5def2 100%);
  --solid-border-h: #f2f6ff;
  --solid-shadow: inset 0 1px 0 #ffffff, 0 0 22px rgba(186,208,255,0.35), 0 8px 18px rgba(255,255,255,0.12);
  --ghost-bg: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(0,0,0,0.45) 50%, rgba(160,175,200,0.08));
  --ghost-c: #ffffff; --ghost-border: rgba(198,198,198,0.45);
  --ghost-bg-h: linear-gradient(135deg, rgba(210,225,255,0.18), rgba(0,0,0,0.35) 48%, rgba(180,195,220,0.16));
  --ghost-border-h: rgba(220,230,255,0.75);
  --hero-bg:
    radial-gradient(120% 60% at 50% 8%, rgba(120,140,190,0.12) 0%, rgba(120,140,190,0) 55%),
    radial-gradient(90% 55% at 50% 108%, rgba(110,140,210,0.10) 0%, rgba(0,0,0,0) 60%),
    #000000;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#000000; --text:#ffffff; --muted:#9a9a9a;
    --border: rgba(255,255,255,0.16); --card-bg: rgba(20,20,20,0.72);
    --card-line: rgba(255,255,255,0.14); --card-shadow: 0 10px 30px rgba(0,0,0,0.5);
    --burger-bg: rgba(8,8,8,0.55); --nav-border-h: rgba(235,235,235,0.9);
    --solid-bg: linear-gradient(180deg, #ffffff 0%, #e7e7e7 48%, #cfcfcf 100%);
    --solid-c: #111111; --solid-border: #ffffff;
    --solid-bg-h: linear-gradient(180deg, #ffffff 0%, #f3f6ff 42%, #d5def2 100%);
    --solid-border-h: #f2f6ff;
    --solid-shadow: inset 0 1px 0 #ffffff, 0 0 22px rgba(186,208,255,0.35), 0 8px 18px rgba(255,255,255,0.12);
    --ghost-bg: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(0,0,0,0.45) 50%, rgba(160,175,200,0.08));
    --ghost-c: #ffffff; --ghost-border: rgba(198,198,198,0.45);
    --ghost-bg-h: linear-gradient(135deg, rgba(210,225,255,0.18), rgba(0,0,0,0.35) 48%, rgba(180,195,220,0.16));
    --ghost-border-h: rgba(220,230,255,0.75);
    --hero-bg:
      radial-gradient(120% 60% at 50% 8%, rgba(120,140,190,0.12) 0%, rgba(120,140,190,0) 55%),
      radial-gradient(90% 55% at 50% 108%, rgba(110,140,210,0.10) 0%, rgba(0,0,0,0) 60%),
      #000000; }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; }
body {
  font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  background: var(--hero-bg) !important;
}
.page {
  position: relative; z-index: 1;
  max-width: 720px; margin: 0 auto;
  padding: 24px 24px 60px;
  min-height: 100dvh;
  display: flex; flex-direction: column;
}
.topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 44px; }
.logo { display: inline-flex; align-items: center; gap: 9px; font-size: 15.5px; font-weight: 600; letter-spacing: -0.03em; color: var(--text); }
.logo svg { width: 22px; height: 22px; }
.logo-suffix { font-weight: 400; }
.theme-btn {
  width: 40px; height: 40px; border-radius: 6px;
  border: 1px solid var(--border); background: var(--burger-bg);
  cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  color: var(--text); transition: border-color 0.2s ease, background 0.2s ease;
}
.theme-btn:hover { border-color: var(--nav-border-h); background: rgba(128,128,128,0.14); }
.theme-btn svg { width: 17px; height: 17px; }
.theme-btn .ic-sun { display: none; }
:root[data-theme="dark"] .theme-btn .ic-sun { display: block; }
:root[data-theme="dark"] .theme-btn .ic-moon { display: none; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .theme-btn .ic-sun { display: block; }
  :root:not([data-theme="light"]) .theme-btn .ic-moon { display: none; }
}
.card {
  background: var(--card-bg);
  border: 1px solid var(--card-line);
  border-radius: 18px;
  padding: 36px 32px;
  box-shadow: var(--card-shadow);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.card { text-align: center; }
.card h1 { font-size: 27px; font-weight: 600; letter-spacing: -0.03em; margin-bottom: 10px; }
.lede { color: var(--muted); font-size: 14.5px; line-height: 1.65; margin-bottom: 26px; max-width: 460px; margin-left: auto; margin-right: auto; }
.qr-box {
  border: 1px dashed var(--card-line);
  border-radius: 14px;
  padding: 26px;
  text-align: center; color: var(--muted); font-size: 13.5px; line-height: 1.8;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.qr-box img { width: 220px; height: auto; border-radius: 10px; display: block; margin: 0 auto; }
.btn {
  position: relative; isolation: isolate; overflow: hidden;
  display: inline-flex; align-items: center; justify-content: center;
  height: 42px; padding: 0 18px; border-radius: 7px;
  font-size: 13.5px; font-weight: 500; letter-spacing: -0.02em; line-height: 1;
  white-space: nowrap; cursor: pointer; border: 1px solid transparent;
  transition: background 0.35s ease, border 0.35s ease, box-shadow 0.35s ease, color 0.35s ease;
}
.btn-solid { background: var(--solid-bg); color: var(--solid-c); border-color: var(--solid-border); }
.btn-solid:hover { background: var(--solid-bg-h); border-color: var(--solid-border-h); box-shadow: var(--solid-shadow); }
.btn-ghost { background: var(--ghost-bg); color: var(--ghost-c); border-color: var(--ghost-border); }
.btn-ghost:hover { background: var(--ghost-bg-h); border-color: var(--ghost-border-h); box-shadow: var(--ghost-shadow); }
.links { margin-top: 26px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.back { margin-top: 22px; }
@media (max-width: 560px){
  .card { padding: 26px 20px; }
}
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <a class="logo" href="index.html" aria-label="SoundScreen 返回任务大厅">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M19 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      SoundScreen<span class="logo-suffix">.ai</span>
    </a>
    <button class="theme-btn" id="theme-btn" aria-label="切换深浅色">
      <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>

  <div class="card">
    <h1>联系我们</h1>
    <p class="lede">通过测试后如有任何疑问，或想进一步了解岗位详情，欢迎通过飞书联系招聘方。</p>

    <div class="qr-box">
      <img id="qr" src="https://soundscreen-pub-1460916286.cos.ap-guangzhou.myqcloud.com/assets/contact/feishu-qr.png" alt="飞书二维码"
           onerror="document.getElementById('qrFallback').style.display='block';this.style.display='none';">
      <div id="qrFallback" style="display:none">飞书二维码待上传<br>请将二维码图片放到 web/assets/contact/feishu-qr.png</div>
    </div>

    <div class="links">
      <a class="btn btn-solid" id="feishu-link" href="https://www.feishu.cn/invitation/page/add_contact/?token=f2dod332-56ba-4206-9443-62e3211376e7&unique_id=sGLTgHFdrjewCxfI9n1KCw==" target="_blank" rel="noopener">通过飞书联系我</a>
    </div>

    <a class="btn btn-ghost back" href="index.html">返回任务大厅</a>
  </div>
</div>

<script>
(function () {
  var btn = document.getElementById('theme-btn');
  if (btn) btn.addEventListener('click', function () { if (window.SPTheme) SPTheme.toggle(); });
  // 飞书链接已配置：https://www.feishu.cn/invitation/page/add_contact/?token=f2dod332-56ba-4206-9443-62e3211376e7
})();
</script>
</body>
</html>
