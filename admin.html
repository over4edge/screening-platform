<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>筛选平台 · 管理后台</title>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="wrap">

  <div class="brand"><span class="logo">管</span><h1>筛选平台 · 管理后台</h1></div>

  <!-- 登录 -->
  <section class="card" id="login-card" style="max-width:420px;margin:40px auto">
    <div id="login-form">
      <h2 style="margin:0 0 12px;font-size:17px">管理员登录</h2>
      <div class="field"><label>账号</label><input class="input" id="in-user" autocomplete="username"></div>
      <div class="field"><label>口令</label><input class="input" id="in-pw" type="password" autocomplete="current-password"></div>
      <div class="msg" id="login-msg"></div>
      <button class="btn block" id="btn-login">登录</button>
      <p class="muted" style="margin:14px 0 0;text-align:center;font-size:13px">还没有账号？<a href="#" id="go-register" style="color:var(--signal,#4a7cff)">注册批改账号</a></p>
    </div>
    <div id="register-form" style="display:none">
      <h2 style="margin:0 0 12px;font-size:17px">注册批改账号</h2>
      <div class="field"><label>姓名/备注</label><input class="input" id="r-name" placeholder="如 李四"></div>
      <div class="field"><label>账号（3-20 位小写字母/数字/下划线）</label><input class="input" id="r-user" autocomplete="off"></div>
      <div class="field"><label>口令（至少 6 位）</label><input class="input" id="r-pw" type="password" autocomplete="new-password"></div>
      <div class="field"><label>确认口令</label><input class="input" id="r-pw2" type="password" autocomplete="new-password"></div>
      <div class="msg" id="reg-msg"></div>
      <button class="btn block" id="btn-register">注册</button>
      <p class="muted" style="margin:14px 0 0;text-align:center;font-size:13px">已有账号？<a href="#" id="go-login" style="color:var(--signal,#4a7cff)">返回登录</a></p>
    </div>
  </section>

  <!-- 主面板 -->
  <section id="panel" style="display:none">
    <div class="tabs">
      <span id="whoami" class="muted" style="align-self:center;margin-right:12px;font-size:13px"></span>
      <button id="tab-tasks" class="on">任务管理</button>
      <button id="tab-subs">提交记录</button>
      <button id="tab-accounts" style="display:none">账号管理</button>
      <button class="on" style="margin-left:auto;background:transparent;color:var(--sub);border-color:var(--line)" id="btn-logout">退出</button>
    </div>

    <div id="pane-tasks">
      <div class="toolbar"><button class="btn small" id="btn-new">＋ 新建任务</button>
        <a class="btn small ghost" href="index.html" target="_blank">打开任务大厅</a></div>
      <div class="card" style="padding:6px"><table>
